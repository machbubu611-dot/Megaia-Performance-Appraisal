    // --- 5. 核心運算函式 ---
    const getEmptyNursingRecord = () => ({
      serviceData: { self: {}, manager: {}, storeManager: {} },
      serviceSignatures: { selfDate: new Date().toISOString().split('T')[0], selfSubmitted: false, managerName: '', managerDate: new Date().toISOString().split('T')[0], managerSubmitted: false, storeManagerName: '', storeManagerDate: new Date().toISOString().split('T')[0], storeManagerComment: '', storeManagerSubmitted: false },
      safetyData: {}, safetySignatures: { headNurseName: '', sectionDates: {} },
      isServiceComplete: false, isSafetyComplete: false
    });

    const getEmptyCounterRecord = () => ({ evaluatorTitle: '', evaluatorName: '', evaluateDate: new Date().toISOString().split('T')[0], scores: {}, feedback: '', isComplete: false });

    const calculateNursingBonus = (record) => {
      let serviceBonus = 0; let safetyBonus = 0;
      if (record) {
        if (record.isServiceComplete) {
          const finalServiceScore = Object.values(record.serviceData?.storeManager || {}).reduce((sum, val) => sum + (val || 0), 0);
          if (finalServiceScore === 10) serviceBonus = 3000; else if (finalServiceScore >= 7) serviceBonus = 1500;
        }
        if (record.isSafetyComplete) {
          let redFailCount = 0; let blackFailCount = 0;
          SAFETY_SECTIONS.forEach(sec => sec.categories.forEach(cat => cat.items.forEach(item => {
            if (record.safetyData?.[item.id] === 'fail') { if (item.isRed) redFailCount++; else blackFailCount++; }
          })));
          if (redFailCount > 0) safetyBonus = 0; else if (blackFailCount === 0) safetyBonus = 3000; else if (blackFailCount <= 5) safetyBonus = 1500; else safetyBonus = 0;
        }
      }
      return { serviceBonus, safetyBonus, total: serviceBonus + safetyBonus };
    };

    const calculateCounterBonus = (avgScore) => { if (avgScore < 3) return 0; if (avgScore < 4) return 1000; if (avgScore < 5) return 2000; return 3000; };
    const calculateDirectorBonus = (avgScore) => { if (avgScore < 3) return 0; if (avgScore < 4) return 2000; if (avgScore < 5) return 3000; return 4000; };

    const getCounterStaffSummary = (rec, expectedCount) => {
      if (!rec || !rec.evaluations) return { isComplete: false, avgScore: 0, evalCount: 0, bonus: 0 };
      const evals = Object.values(rec.evaluations).filter(e => e.isComplete);
      if (evals.length === 0) return { isComplete: false, avgScore: 0, evalCount: 0, bonus: 0 };
      let totalAvg = 0; evals.forEach(e => { totalAvg += Object.values(e.scores || {}).reduce((a, b) => a + b, 0) / 5; });
      const avgScore = parseFloat((totalAvg / evals.length).toFixed(1));
      return { isComplete: evals.length >= expectedCount, avgScore, evalCount: evals.length, bonus: calculateCounterBonus(avgScore) };
    };

    // 處理匯出時的輸入框轉換
    const replaceInputsWithDivs = (container) => {
      const inputs = container.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]), select, textarea');
      const replacements = [];
      inputs.forEach(input => {
        if (window.getComputedStyle(input).display === 'none') return;
        const replacement = document.createElement('div');
        let text = input.value || '';
        if (input.tagName.toLowerCase() === 'select') text = input.options[input.selectedIndex]?.text || '';
        replacement.innerText = text;
        const style = window.getComputedStyle(input);
        replacement.style.cssText = `display:flex;align-items:center;justify-content:${style.textAlign==='center'||input.classList.contains('text-center')?'center':'flex-start'};width:${style.width};height:${style.height};min-height:${style.minHeight};padding:${style.padding};margin:${style.margin};font-size:${style.fontSize};font-family:${style.fontFamily};font-weight:${style.fontWeight};color:${style.color};background-color:${style.backgroundColor};border:${style.border};border-radius:${style.borderRadius};box-sizing:border-box;white-space:${input.tagName.toLowerCase()==='textarea'?'pre-wrap':'nowrap'};overflow:hidden;`;
        input.style.setProperty('display', 'none', 'important');
        input.parentNode.insertBefore(replacement, input);
        replacements.push({ original: input, replacement });
      });
      return replacements;
    };
    const restoreInputs = (replacements) => {
      replacements.forEach(({ original, replacement }) => {
        if (replacement.parentNode) replacement.parentNode.removeChild(replacement);
        original.style.display = '';
      });
    };

    // 抽離的共用儀表板渲染
    const renderCounterTableRows = (targetMonth, targetBrand, rostersData, recordsData, dashboardStatus) => {
      const rows = [];
      const brandsToRender = targetBrand ? [targetBrand] : COUNTER_BRANDS;
      
      brandsToRender.forEach(brand => {
        COUNTER_BRANCHES[brand].forEach(branch => {
          if (!rostersData.counter[brand] || !rostersData.counter[brand][branch]) return;
          
          let branchSum = 0; let branchCount = 0;
          const evaluators = rostersData.counter[brand][branch].evaluators.filter(e => e.active);
          const expectedCount = evaluators.length;
          const evaluatees = rostersData.counter[brand][branch].evaluatees.filter(e => e.active);
          const dirInfo = rostersData.counter[brand][branch].director;
          const hasDir = dirInfo && dirInfo.active && dirInfo.name;
          const rowSpanCount = evaluatees.length + (hasDir ? 1 : 0);

          if (rowSpanCount === 0) return;

          evaluatees.forEach((staffObj, sIdx) => {
            const staff = staffObj.name;
            const rec = recordsData[targetMonth]?.[brand]?.[branch]?.[staff];
            const summary = getCounterStaffSummary(rec, expectedCount);
            if (summary.isComplete) { branchSum += summary.avgScore; branchCount++; }
            
            const evals = Object.keys(rec?.evaluations || {}).filter(k => rec.evaluations[k].isComplete).map(k => {
              const sum = Object.values(rec.evaluations[k].scores).reduce((a,b) => a+b, 0);
              return { name: k, score: sum/5 };
            });
            
            const ev1 = evals[0] ? `${evals[0].name}` : '-'; const s1 = evals[0] ? evals[0].score : '-';
            const ev2 = evals[1] ? `${evals[1].name}` : '-'; const s2 = evals[1] ? evals[1].score : '-';
            const ev3 = evals[2] ? `${evals[2].name}` : '-'; const s3 = evals[2] ? evals[2].score : '-';
            const ev4 = evals[3] ? `${evals[3].name}` : '-'; const s4 = evals[3] ? evals[3].score : '-';

            rows.push(
              <tr key={`${brand}-${branch}-${staff}`} className="hover:bg-white transition-colors">
                {sIdx === 0 && <td rowSpan={rowSpanCount} className="td-cell border-r border-slate-200 align-top bg-slate-50">{brand}</td>}
                {sIdx === 0 && <td rowSpan={rowSpanCount} className="td-cell border-r border-slate-200 font-bold align-top bg-slate-50">{branch}</td>}
                <td className="td-cell">{staff}</td>
                <td className="td-cell text-slate-500 text-sm">客服櫃台</td>
                <td className="td-center">
                  {summary.isComplete ? (
                    <span className="status-badge bg-teal-100 text-teal-700">已完成</span>
                  ) : (
                    <span className="status-badge bg-orange-100 text-orange-700">{summary.evalCount > 0 ? `${summary.evalCount}/${expectedCount}人已評` : '未完成'}</span>
                  )}
                </td>
                <td className="td-center text-sm text-slate-600 bg-slate-100/50 border-l border-slate-100">{ev1}</td>
                <td className="td-center text-sm font-bold text-teal-700 bg-slate-100/50">{s1}</td>
                <td className="td-center text-sm text-slate-600 border-l border-slate-100">{ev2}</td>
                <td className="td-center text-sm font-bold text-teal-700">{s2}</td>
                <td className="td-center text-sm text-slate-600 bg-slate-100/50 border-l border-slate-100">{ev3}</td>
                <td className="td-center text-sm font-bold text-teal-700 bg-slate-100/50">{s3}</td>
                <td className="td-center text-sm text-slate-600 border-l border-slate-100">{ev4}</td>
                <td className="td-center text-sm font-bold text-teal-700">{s4}</td>
                <td className="td-center font-bold text-sky-700 text-lg border-l border-slate-200">{summary.evalCount > 0 ? summary.avgScore : '-'}</td>
                <td className="td-cell text-right font-bold text-orange-600 border-l border-slate-100">{summary.isComplete ? `$${summary.bonus}` : '-'}</td>
              </tr>
            );
          });

          if (hasDir) {
             const dirAvg = branchCount > 0 ? parseFloat((branchSum/branchCount).toFixed(1)) : 0;
             rows.push(
               <tr key={`${brand}-${branch}-dir`} className="border-b-2 border-slate-300 bg-indigo-50/40">
                 {evaluatees.length === 0 && <td rowSpan={1} className="td-cell border-r border-slate-200 font-bold align-top bg-slate-50">{branch}</td>}
                 <td className="td-cell font-bold text-indigo-900">{dirInfo.name}</td>
                 <td className="td-cell font-bold text-indigo-700 text-sm">該店主任</td>
                 <td className="td-center">{branchCount > 0 ? <span className="status-badge bg-emerald-100 text-emerald-700">已結算</span> : <span className="text-slate-400 text-xs font-bold">待結算</span>}</td>
                 <td colSpan="8" className="td-center text-slate-500 text-xs tracking-widest font-bold border-l border-slate-200">── 此為該店所有櫃台平均 ──</td>
                 <td className="td-center font-bold text-sky-800 text-lg border-l border-slate-200">{branchCount > 0 ? dirAvg : '-'}</td>
                 <td className="td-cell text-right font-bold text-orange-700 text-lg border-l border-slate-200">{branchCount > 0 ? '$' + calculateDirectorBonus(dirAvg) : '-'}</td>
               </tr>
             );
          }
        });
      });
      return rows;
    };

      const exportMedia = (elementId, fileName, format = 'png') => {

              <div onClick={() => enterSystem('nursing')} className="bg-slate-50 rounded-3xl shadow-xl shadow-slate-300/50 hover:shadow-2xl transition-all cursor-pointer p-8 text-center border-t-8 border-sky-600 hover:-translate-y-2 group"><div className="w-24 h-24 mx-auto bg-sky-100/50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-inner"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="w-12 h-12 text-sky-700"><rect x="2" y="6" width="20" height="14" rx="2" ry="2"></rect><path d="M8 6V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v2"></path><path d="M12 10v6"></path><path d="M9 13h6"></path></svg></div><h2 className="text-2xl font-bold text-sky-800 mb-3">護理部評核</h2><p className="text-slate-500 font-medium">美加專用</p><div className="mt-6 inline-block bg-sky-100 text-sky-800 px-6 py-2 rounded-full text-sm font-bold group-hover:bg-sky-700 group-hover:text-white transition-colors">進入系統 ➔</div></div>
              <div onClick={() => enterSystem('counter')} className="bg-slate-50 rounded-3xl shadow-xl shadow-slate-300/50 hover:shadow-2xl transition-all cursor-pointer p-8 text-center border-t-8 border-teal-600 hover:-translate-y-2 group"><div className="w-24 h-24 mx-auto bg-teal-100/50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-inner"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="w-12 h-12 text-teal-700"><path d="M10 2h4"></path><path d="M12 14v-4"></path><path d="M8 22h8"></path><path d="M15.8 7A4 4 0 0 0 8.2 7c-2 0-4 1.5-4 4.5 0 1.5 1 3 2.5 3.5h10.6c1.5-.5 2.5-2 2.5-3.5 0-3-2-4.5-4-4.5z"></path></svg></div><h2 className="text-2xl font-bold text-teal-800 mb-3">櫃台客服評核</h2><p className="text-slate-500 font-medium">美加 / 康博 雙品牌</p><div className="mt-6 inline-block bg-teal-100 text-teal-800 px-6 py-2 rounded-full text-sm font-bold group-hover:bg-teal-700 group-hover:text-white transition-colors">進入系統 ➔</div></div>
            </div>
          </div>
        </div>
      );

      const renderHome = () => {
        const isNursing = sysModule === 'nursing';
        return (
        <div className={`p-6 max-w-lg mx-auto min-h-screen animate-fade-in shadow-xl shadow-slate-200/50 md:my-6 md:rounded-3xl md:min-h-[90vh] flex flex-col justify-between relative overflow-hidden ${isNursing ? 'bg-gradient-to-br from-slate-100 via-sky-50/50 to-slate-200' : 'bg-gradient-to-br from-slate-100 via-teal-50/50 to-slate-200'}`}>
          <div className="relative z-10 flex-1">
            <div className="text-center mb-8 relative pt-4"><h1 className={`text-3xl font-bold tracking-wider mb-2 ${isNursing ? 'text-sky-800' : 'text-teal-800'}`}>{isNursing ? '護理部評核系統 (美加)' : '櫃台客服評核系統'}</h1><p className="text-slate-500 mt-2 font-medium">請先設定評核基本資料</p><button onClick={copyShareLink} className="mt-4 btn-outline border-slate-300 text-slate-700 px-4">🔗 複製專屬分享連結</button></div>
            {isNursing ? (
              <div className="space-y-6 animate-fade-in">
                <div className="card-panel shadow-sm">
                  <div className="mb-4"><label className="block text-slate-700 font-bold mb-2">選擇評分月份</label><select className="input-std" value={baseInfo.month} onChange={(e) => handleBaseInfoChange('month', e.target.value)}><option value="">-- 請選擇月份 --</option>{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                  <div className="mb-4"><label className="block text-slate-700 font-bold mb-2">選擇分院 (美加)</label><select className="input-std" value={baseInfo.branch} onChange={(e) => handleBaseInfoChange('branch', e.target.value)}><option value="">-- 請選擇分院 --</option>{NURSING_BRANCHES.map(b => { if (!rosters.nursing[b]) return null; const allDone = baseInfo.month && rosters.nursing[b].filter(n=>n.active).length > 0 && rosters.nursing[b].filter(n=>n.active).every(n => nursingRecords[baseInfo.month]?.[b]?.[n.name]?.isServiceComplete && nursingRecords[baseInfo.month]?.[b]?.[n.name]?.isSafetyComplete); return <option key={b} value={b}>{b} {allDone ? '✅ (全員完核)' : ''}</option>; })}</select></div>
                  <div><label className="block text-slate-700 font-bold mb-2">選擇受評者 (護理師)</label><select disabled={!baseInfo.branch} className="input-std" value={baseInfo.nurse} onChange={(e) => handleBaseInfoChange('nurse', e.target.value)}><option value="">{baseInfo.branch ? '-- 請選擇受評者 --' : '-- 請先選擇分院 --'}</option>{baseInfo.branch && rosters.nursing[baseInfo.branch]?.filter(n=>n.active).map(n => { const isDone = nursingRecords[baseInfo.month]?.[baseInfo.branch]?.[n.name]?.isServiceComplete && nursingRecords[baseInfo.month]?.[baseInfo.branch]?.[n.name]?.isSafetyComplete; return <option key={n.name} value={n.name}>{n.name} {isDone ? '✅ (已完成)' : ''}</option>; })}</select></div>
                </div>
                <div className="space-y-4 pt-2">
                  <button disabled={!canStartAssessment} onClick={() => navigateTo('service')} className={`btn-primary ${canStartAssessment ? 'bg-sky-700 hover:bg-sky-800' : 'bg-slate-300'}`}>進入「服務品質評核」</button>
                  <button disabled={!canStartAssessment} onClick={() => navigateTo('safety')} className={`btn-primary ${canStartAssessment ? 'bg-teal-700 hover:bg-teal-800' : 'bg-slate-300'}`}>進入「醫療安全評核」</button>
                  <div className="grid grid-cols-2 gap-3 mt-4"><button onClick={() => navigateTo('report')} className="btn-outline border-sky-200 text-sky-800 bg-slate-50">📄 單人報表</button><button onClick={() => navigateTo('dashboard')} className="btn-outline border-indigo-200 text-indigo-800 bg-slate-50">📊 全院儀表板</button></div>
                </div>
              </div>
            ) : (
              <div className="space-y-6 animate-fade-in">
                <div className="card-panel shadow-sm">
                  <div className="mb-4"><label className="block text-slate-700 font-bold mb-2">選擇評分月份</label><select className="input-std" value={counterInfo.month} onChange={(e) => handleCounterInfoChange('month', e.target.value)}><option value="">-- 請選擇月份 --</option>{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                  <div className="mb-4"><label className="block text-slate-700 font-bold mb-2">選擇品牌</label><select className="input-std" value={counterInfo.brand} onChange={(e) => handleCounterInfoChange('brand', e.target.value)}><option value="">-- 請選擇品牌 --</option>{COUNTER_BRANDS.map(b => <option key={b} value={b}>{b}</option>)}</select></div>
                  <div className="mb-4"><label className="block text-slate-700 font-bold mb-2">選擇分院</label><select disabled={!counterInfo.brand} className="input-std" value={counterInfo.branch} onChange={(e) => handleCounterInfoChange('branch', e.target.value)}><option value="">{counterInfo.brand ? '-- 請選擇分院 --' : '-- 請先選擇品牌 --'}</option>{counterInfo.brand && COUNTER_BRANCHES[counterInfo.brand].map(b => { if (!rosters.counter[counterInfo.brand][b]) return null; const expectedCount = rosters.counter[counterInfo.brand][b].evaluators.filter(e=>e.active).length; const evaluatees = rosters.counter[counterInfo.brand][b].evaluatees.filter(e=>e.active); const allDone = counterInfo.month && evaluatees.length > 0 && evaluatees.every(n => getCounterStaffSummary(counterRecords[counterInfo.month]?.[counterInfo.brand]?.[b]?.[n.name], expectedCount).isComplete); return <option key={b} value={b}>{b} {allDone ? '✅ (全員完核)' : ''}</option>; })}</select></div>
                  <div className="mb-4"><label className="block text-slate-700 font-bold mb-2">選擇您的身分 (評核人)</label><select disabled={!counterInfo.branch} className="input-std" value={counterInfo.evaluatorName} onChange={(e) => handleCounterInfoChange('evaluatorName', e.target.value)}><option value="">{counterInfo.branch ? '-- 請選擇您的姓名 --' : '-- 請先選擇分院 --'}</option>{counterInfo.brand && counterInfo.branch && rosters.counter[counterInfo.brand][counterInfo.branch].evaluators.filter(e=>e.active).map(ev => { const evaluatees = rosters.counter[counterInfo.brand][counterInfo.branch].evaluatees.filter(e=>e.active); const hasEvaluatedAll = evaluatees.length > 0 && evaluatees.every(emp => counterRecords[counterInfo.month]?.[counterInfo.brand]?.[counterInfo.branch]?.[emp.name]?.evaluations?.[ev.name]?.isComplete); return <option key={ev.name} value={ev.name}>{ev.title} - {ev.name} {hasEvaluatedAll ? '✅ (已完成)' : ''}</option>; })}</select></div>
                  <div><label className="block text-slate-700 font-bold mb-2">選擇受評者 (客服櫃台)</label><select disabled={!counterInfo.evaluatorName} className="input-std" value={counterInfo.staff} onChange={(e) => handleCounterInfoChange('staff', e.target.value)}><option value="">{counterInfo.evaluatorName ? '-- 請選擇受評者 --' : '-- 請先選擇評核人 --'}</option>{counterInfo.brand && counterInfo.branch && rosters.counter[counterInfo.brand][counterInfo.branch].evaluatees.filter(e=>e.active).map(n => { const rec = counterRecords[counterInfo.month]?.[counterInfo.brand]?.[counterInfo.branch]?.[n.name]; const expectedCount = rosters.counter[counterInfo.brand][counterInfo.branch].evaluators.filter(e=>e.active).length; const summary = getCounterStaffSummary(rec, expectedCount); const isEvalByMe = rec?.evaluations?.[counterInfo.evaluatorName]?.isComplete; let statusStr = ''; if (summary.isComplete) statusStr = '🌟 (全員已評)'; else if (isEvalByMe) statusStr = '✅ (您已評)'; return <option key={n.name} value={n.name}>{n.name} {statusStr}</option>; })}</select></div>
                </div>
                
                <div className="space-y-4 pt-2">
                  <button disabled={!counterInfo.staff || !counterInfo.month || !counterInfo.evaluatorName} onClick={() => navigateTo('counter_form')} className={`btn-primary ${counterInfo.staff && counterInfo.month && counterInfo.evaluatorName ? 'bg-teal-700 hover:bg-teal-800' : 'bg-slate-300'}`}>進入「櫃台客服品質考核」</button>
                  <div className="grid grid-cols-2 gap-3 mt-4">
                    <button onClick={() => { if (isSuperAdmin || isCounterReportUnlocked) navigateTo('report'); else { setPendingRole('counter_report'); setShowPasswordModal(true); } }} className={`btn-outline ${isCounterReportUnlocked ? 'border-emerald-200 text-emerald-800 bg-emerald-50' : 'border-teal-200 text-teal-800 bg-slate-50'}`}>{isCounterReportUnlocked ? '🔓 單店報表' : '🔒 單店報表'}</button>
                    <button onClick={() => { if (isSuperAdmin || isCounterReportUnlocked) navigateTo('dashboard'); else { setPendingRole('counter_report_dash'); setShowPasswordModal(true); } }} className={`btn-outline ${isCounterReportUnlocked ? 'border-emerald-200 text-emerald-800 bg-emerald-50' : 'border-indigo-200 text-indigo-800 bg-slate-50'}`}>{isCounterReportUnlocked ? '🔓 橫式全院總表' : '🔒 橫式全院總表'}</button>
                  </div>
                  {isSuperAdmin && counterInfo.month && (
                    <div className="mt-4 p-4 bg-slate-100/80 rounded-xl border border-slate-200 flex flex-col gap-3 shadow-inner"><div className="flex justify-between items-center"><span className="text-sm font-bold text-slate-700">總管權限：報表開放狀態</span><button onClick={handleToggleCounterUnlock} className={`px-4 py-1.5 rounded-lg text-xs font-bold text-white shadow-sm transition-colors ${isCounterManuallyUnlocked ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-500 hover:bg-slate-600'}`}>{isCounterManuallyUnlocked ? '已手動開放 (點擊關閉)' : '目前鎖定 (點擊強制開放)'}</button></div>{isCounterAutoUnlocked && !isCounterManuallyUnlocked && <p className="text-xs text-emerald-700 font-bold bg-emerald-100/70 p-2 rounded-lg border border-emerald-200">✨ 系統偵測到本月櫃台評核已完成，目前為自動開放狀態！</p>}</div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
        );
      };

      const renderDashboard = () => (
        <div className="max-w-7xl mx-auto bg-slate-100 min-h-screen p-6">
          <div className="flex justify-between items-center mb-6">
            <button onClick={() => navigateTo('home')} className="flex items-center text-slate-500 hover:text-slate-800 font-bold transition-colors">返回首頁</button>
            <div className="flex gap-2"><button onClick={() => exportMedia('dashboard-panel', `全院儀表板_${dashMonth}`)} className="bg-orange-500 text-white font-bold px-4 py-2 rounded-lg text-sm hover:bg-orange-600">📸 儲存圖片</button><button onClick={exportDashboardToExcel} className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm hover:bg-emerald-700">📊 匯出 Excel</button></div>
          </div>
          <div id="dashboard-panel" className="card-panel !p-0 overflow-hidden print-panel">
            <div className="bg-gradient-to-r from-slate-700 to-slate-600 p-6 text-white text-center">
               <h2 className="text-2xl font-bold tracking-widest mb-3">全院評核進度儀表板 ({sysModule === 'nursing' ? '護理部' : '櫃台部'})</h2>
               <div className="inline-flex items-center bg-white/20 px-4 py-2 rounded-full no-print shadow-inner"><label className="mr-2 font-bold text-sm">切換月份:</label><select value={dashMonth} onChange={(e) => setDashMonth(e.target.value)} className="text-slate-800 font-bold px-2 py-1 rounded outline-none">{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
            </div>
            <div className="p-6 overflow-x-auto">
              {sysModule === 'nursing' ? (
                <table className="w-full text-left border-collapse">
                  <thead><tr className="bg-slate-100"><th className="th-cell">分院</th><th className="th-cell">護理師</th><th className="th-cell text-center">服務評核</th><th className="th-cell text-center">安全評核</th><th className="th-cell text-center">狀態</th><th className="th-cell text-right text-sky-700">服務獎金</th><th className="th-cell text-right text-emerald-700">安全獎金</th><th className="th-cell text-right text-orange-600">總獎金</th></tr></thead>
                  <tbody>
                    {NURSING_BRANCHES.map((branch) => {
                      if (!rosters.nursing[branch]) return null;
                      const activeNurses = rosters.nursing[branch].filter(n=>n.active).map(n=>n.name);
                      if (activeNurses.length === 0) return null;
                      return activeNurses.map((nurse, nIdx) => {
                        const rec = nursingRecords[dashMonth]?.[branch]?.[nurse];
                        const isSrvDone = !!rec?.isServiceComplete; const isSafDone = !!rec?.isSafetyComplete; const isCalculated = isSrvDone && isSafDone; const bonusInfo = calculateNursingBonus(rec);
                        return (
                          <tr key={`${branch}-${nurse}`} className="hover:bg-white transition-colors">
                            {nIdx === 0 && <td rowSpan={activeNurses.length} className="td-cell border-r border-slate-200 align-top text-slate-500 font-bold">{branch}</td>}
                            <td className="td-cell">{nurse}</td>
                            <td className="td-center text-lg">{isSrvDone ? '✅' : '❌'}</td><td className="td-center text-lg">{isSafDone ? '✅' : '❌'}</td>
                            <td className="td-center">{isCalculated ? <span className="status-badge bg-emerald-100 text-emerald-700">已完成</span> : <span className="status-badge bg-red-100 text-red-700">未完成</span>}</td>
                            <td className="td-cell text-right font-bold text-sky-700">{isCalculated ? `$${bonusInfo.serviceBonus}` : '-'}</td><td className="td-cell text-right font-bold text-emerald-700">{isCalculated ? `$${bonusInfo.safetyBonus}` : '-'}</td><td className="td-cell text-right font-bold text-orange-600 text-lg">{isCalculated ? `$${bonusInfo.total}` : '-'}</td>
                          </tr>
                        )
                      });
                    })}
                  </tbody>
                </table>
              ) : (
                <table className="w-full text-left border-collapse whitespace-nowrap">
                  <thead>
                    <tr className="bg-slate-100">
                      <th className="th-cell">品牌</th><th className="th-cell">分院</th><th className="th-cell">姓名</th><th className="th-cell">職稱</th><th className="th-cell text-center">進度狀態</th>
                      <th className="th-cell text-center">評核人1</th><th className="th-cell text-center text-teal-700">評分1</th>
                      <th className="th-cell text-center">評核人2</th><th className="th-cell text-center text-teal-700">評分2</th>
                      <th className="th-cell text-center">評核人3</th><th className="th-cell text-center text-teal-700">評分3</th>
                      <th className="th-cell text-center">評核人4</th><th className="th-cell text-center text-teal-700">評分4</th>
                      <th className="th-cell text-center text-sky-700">最終平均</th><th className="th-cell text-right text-orange-600">達成獎金</th>
                    </tr>
                  </thead>
                  <tbody>{renderCounterTableRows(dashMonth, null, rosters, counterRecords, dashboardStatus)}</tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      );

      const renderReport = () => {
        if (sysModule === 'nursing') {
          const targetRecord = nursingRecords[nursingReportFilter.month]?.[nursingReportFilter.branch]?.[nursingReportFilter.nurse];
          const bonusInfo = calculateNursingBonus(targetRecord); const isCalculated = targetRecord?.isServiceComplete && targetRecord?.isSafetyComplete;
          let finalServiceScore = 0; let redFailCount = 0; let blackFailCount = 0;
          if (targetRecord) {
            finalServiceScore = Object.values(targetRecord.serviceData?.storeManager || {}).reduce((sum, val) => sum + (val || 0), 0);
            SAFETY_SECTIONS.forEach(sec => sec.categories.forEach(cat => cat.items.forEach(item => { if (targetRecord.safetyData?.[item.id] === 'fail') { if (item.isRed) redFailCount++; else blackFailCount++; } })));
          }

          return (
            <div className="max-w-xl mx-auto bg-slate-100 min-h-screen p-6 pb-20">
               <div className="flex justify-between items-center mb-6">
                 <button onClick={() => navigateTo('home')} className="font-bold text-slate-500">返回首頁</button>
                 <div className="flex gap-2"><button onClick={() => exportMedia('report-panel', `護理獎金報表_${nursingReportFilter.nurse}`)} className="bg-orange-500 text-white font-bold px-3 py-1.5 rounded-lg text-sm">📸 儲存圖片</button><button onClick={() => exportMedia('report-panel', `護理獎金報表_${nursingReportFilter.nurse}`, 'pdf')} className="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm">📄 匯出 PDF</button></div>
               </div>
               <div className="card-panel mb-6 flex flex-wrap gap-3">
                  <div className="flex-1 min-w-[120px]"><label className="text-xs text-slate-500 font-bold">月份</label><select value={nursingReportFilter.month} onChange={e => setNursingReportFilter({...nursingReportFilter, month: e.target.value, branch: '', nurse: ''})} className="input-sm">{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                  <div className="flex-1 min-w-[120px]"><label className="text-xs text-slate-500 font-bold">分院</label><select value={nursingReportFilter.branch} onChange={e => setNursingReportFilter({...nursingReportFilter, branch: e.target.value, nurse: ''})} className="input-sm"><option value="">選擇分院</option>{NURSING_BRANCHES.map(b => rosters.nursing[b] ? <option key={b} value={b}>{b}</option> : null)}</select></div>
                  <div className="flex-1 min-w-[120px]"><label className="text-xs text-slate-500 font-bold">護理師</label><select disabled={!nursingReportFilter.branch} value={nursingReportFilter.nurse} onChange={e => setNursingReportFilter({...nursingReportFilter, nurse: e.target.value})} className="input-sm"><option value="">選擇人員</option>{nursingReportFilter.branch && rosters.nursing[nursingReportFilter.branch]?.filter(n=>n.active).map(n => <option key={n.name} value={n.name}>{n.name}</option>)}</select></div>
               </div>
               {!nursingReportFilter.nurse ? (
                  <div className="text-center py-20 text-slate-400 font-bold card-panel">👆 請選擇您要查詢的分院與人員</div>
               ) : (
                 <div id="report-panel" className="card-panel !p-0 overflow-hidden print-panel">
                    <div className="bg-sky-800 p-6 text-white text-center"><h2 className="text-2xl font-bold tracking-widest">護理部獎金結算報表</h2><p className="opacity-80 mt-1">{nursingReportFilter.branch} - {nursingReportFilter.month}</p><div className="mt-4 bg-white/20 inline-block px-6 py-2 rounded-full font-bold text-lg">受評人：{nursingReportFilter.nurse}</div></div>
                    {!targetRecord || !isCalculated ? (
                      <div className="p-10 text-center text-slate-500 font-bold">該人員本月【尚有表單未完成】，無法結算獎金。</div>
                    ) : (
                      <div className="p-6 space-y-6">
                        <div className="border-b border-slate-200 pb-6"><div className="flex justify-between items-center mb-3"><h3 className="font-bold text-lg"><span className="w-2 h-6 bg-sky-500 rounded-full mr-2 inline-block align-middle"></span>服務品質評核</h3><span className="font-bold text-2xl text-sky-700">{finalServiceScore} <span className="text-sm text-slate-400">分</span></span></div><div className="bg-slate-100 p-3 rounded-lg flex justify-between border border-slate-200"><span className="font-bold text-slate-600">發放獎金</span><span className="font-bold text-xl text-sky-800">NT$ {bonusInfo.serviceBonus}</span></div></div>
                        <div><div className="flex justify-between items-center mb-3"><h3 className="font-bold text-lg"><span className="w-2 h-6 bg-teal-500 rounded-full mr-2 inline-block align-middle"></span>醫療安全評核</h3></div>
                          <div className="grid grid-cols-2 gap-3 mb-4 text-center">
                              <div className={`p-3 rounded-lg border ${redFailCount > 0 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-white border-slate-200 text-slate-600'}`}><p className="text-xs mb-1 font-bold">🔴 紅字不合格</p><p className="font-black text-2xl">{redFailCount}</p></div>
                              <div className={`p-3 rounded-lg border ${blackFailCount > 5 ? 'bg-orange-50 border-orange-200 text-orange-700' : 'bg-white border-slate-200 text-slate-600'}`}><p className="text-xs mb-1 font-bold">⚫ 黑字不合格</p><p className="font-black text-2xl">{blackFailCount}</p></div>
                          </div>
                          <div className="bg-slate-100 p-3 rounded-lg flex justify-between border border-slate-200"><span className="font-bold text-slate-600">發放獎金</span><span className="font-bold text-xl text-teal-800">NT$ {bonusInfo.safetyBonus}</span></div>
                        </div>
                      </div>
                    )}
                    {isCalculated && <div className="bg-indigo-50 p-6 border-t border-indigo-200 flex justify-between"><span className="text-lg font-bold text-indigo-900">總計發放獎金</span><span className="text-3xl font-black text-indigo-700">NT$ {bonusInfo.total}</span></div>}
                 </div>
               )}
            </div>
          );
        } else {
          return (
            <div className="max-w-6xl mx-auto bg-slate-100 min-h-screen p-6 pb-20">
               <div className="flex justify-between items-center mb-6">
                 <button onClick={() => navigateTo('home')} className="font-bold text-slate-500">返回首頁</button>
                 <div className="flex gap-2"><button onClick={() => exportMedia('report-panel', `櫃台單店報表_${counterReportFilter.brand}_${counterReportFilter.month}`)} className="bg-orange-500 text-white font-bold px-4 py-2 rounded-lg text-sm">📸 儲存圖片</button><button onClick={exportDashboardToExcel} className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm">📊 匯出 Excel</button><button onClick={() => exportMedia('report-panel', `櫃台單店報表_${counterReportFilter.brand}_${counterReportFilter.month}`, 'pdf')} className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg text-sm">📄 匯出 PDF</button></div>
               </div>
               <div className="card-panel mb-6 flex flex-wrap gap-3">
                  <div className="flex-1 min-w-[120px]"><label className="text-xs text-slate-500 font-bold">月份</label><select value={counterReportFilter.month} onChange={e => setCounterReportFilter({...counterReportFilter, month: e.target.value, brand: ''})} className="input-sm">{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                  <div className="flex-1 min-w-[120px]"><label className="text-xs text-slate-500 font-bold">品牌</label><select value={counterReportFilter.brand} onChange={e => setCounterReportFilter({...counterReportFilter, brand: e.target.value})} className="input-sm"><option value="">選擇品牌</option>{COUNTER_BRANDS.map(b => <option key={b} value={b}>{b}</option>)}</select></div>
               </div>
               {!counterReportFilter.brand ? (
                  <div className="text-center py-20 text-slate-400 font-bold card-panel">👆 請選擇品牌以查看該品牌各店獎金</div>
               ) : (
                 <div id="report-panel" className="card-panel !p-0 overflow-hidden print-panel">
                    <div className="bg-teal-700 p-6 text-white text-center"><h2 className="text-2xl font-bold tracking-widest mb-2">櫃台客服獎金結算報表</h2><p className="text-teal-100 font-medium">{counterReportFilter.brand} - {counterReportFilter.month}</p></div>
                    <div className="p-6 overflow-x-auto">
                      <table className="w-full text-left border-collapse whitespace-nowrap">
                        <thead><tr className="bg-slate-100"><th className="th-cell">分院</th><th className="th-cell">姓名</th><th className="th-cell">職稱</th><th className="th-cell text-center">進度狀態</th><th className="th-cell text-center">評核人1</th><th className="th-cell text-center text-teal-700">評分1</th><th className="th-cell text-center">評核人2</th><th className="th-cell text-center text-teal-700">評分2</th><th className="th-cell text-center">評核人3</th><th className="th-cell text-center text-teal-700">評分3</th><th className="th-cell text-center">評核人4</th><th className="th-cell text-center text-teal-700">評分4</th><th className="th-cell text-center text-sky-700">最終平均</th><th className="th-cell text-right text-orange-600">達成獎金</th></tr></thead>
                        <tbody>{renderCounterTableRows(counterReportFilter.month, counterReportFilter.brand, rosters, counterRecords, dashboardStatus)}</tbody>
                      </table>
                    </div>
                 </div>
               )}
            </div>
          );
        }
      };

      const renderRosterManager = () => {
        const toggleNursingActive = (branch, idx) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.nursing[branch][idx].active = !n.nursing[branch][idx].active; return n; }); };
        const updateNursingName = (branch, idx, val) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.nursing[branch][idx].name = val; return n; }); };
        const deleteNursing = (branch, idx) => { setSysModal({ show: true, msg: `確定要永久刪除護理師嗎？\n建議：取消勾選「啟用」隱藏即可。`, type: 'confirm', onConfirm: () => setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.nursing[branch].splice(idx, 1); return n; }) }); };

        const toggleCounterDirActive = (brand, branch) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].director.active = !n.counter[brand][branch].director.active; return n; }); };
        const updateCounterDirName = (brand, branch, val) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].director.name = val; return n; }); };
        const toggleCounterEvalActive = (brand, branch, idx) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluators[idx].active = !n.counter[brand][branch].evaluators[idx].active; return n; }); };
        const updateCounterEvalTitle = (brand, branch, idx, val) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluators[idx].title = val; return n; }); };
        const updateCounterEvalName = (brand, branch, idx, val) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluators[idx].name = val; return n; }); };
        const deleteCounterEval = (brand, branch, idx) => { setSysModal({ show: true, msg: `確定刪除評核人嗎？\n建議：取消勾選「啟用」隱藏即可。`, type: 'confirm', onConfirm: () => setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluators.splice(idx, 1); return n; }) }); };
        const toggleCounterEmpActive = (brand, branch, idx) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluatees[idx].active = !n.counter[brand][branch].evaluatees[idx].active; return n; }); };
        const updateCounterEmpName = (brand, branch, idx, val) => { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluatees[idx].name = val; return n; }); };
        const deleteCounterEmp = (brand, branch, idx) => { setSysModal({ show: true, msg: `確定刪除受評者嗎？\n建議：取消勾選「啟用」隱藏即可。`, type: 'confirm', onConfirm: () => setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluatees.splice(idx, 1); return n; }) }); };

        return (
          <div className="max-w-4xl mx-auto bg-slate-100 min-h-screen pb-20">
             <div className="bg-slate-800 text-white p-4 sticky top-0 z-20 shadow-md flex justify-between items-center"><button onClick={() => setCurrentView('settings')} className="text-sm bg-white/20 px-3 py-1 rounded-lg">返回設定</button><h2 className="font-bold text-lg">人員名單管理</h2><button onClick={saveRostersToCloud} className="text-sm bg-sky-600 px-3 py-1 rounded-lg font-bold shadow-sm">💾 儲存</button></div>
             <div className="p-4 flex gap-2"><button onClick={()=>setRosterTab('nursing')} className={`flex-1 py-3 font-bold rounded-xl transition ${rosterTab==='nursing'?'bg-sky-700 text-white shadow-md':'bg-slate-200 text-slate-500'}`}>護理部名單</button><button onClick={()=>setRosterTab('counter')} className={`flex-1 py-3 font-bold rounded-xl transition ${rosterTab==='counter'?'bg-teal-700 text-white shadow-md':'bg-slate-200 text-slate-500'}`}>櫃台部名單</button></div>
             <div className="p-4 space-y-6">
               {rosterTab === 'nursing' && NURSING_BRANCHES.map(branch => {
                 if (!rosters.nursing[branch]) return null;
                 return (
                 <div key={branch} className="card-panel">
                   <h4 className="font-bold text-xl text-sky-800 mb-4 border-b border-sky-100 pb-2">{branch}</h4>
                   {rosters.nursing[branch].map((n, idx) => (
                      <div key={idx} className={`flex items-center gap-3 mb-2 p-2 rounded-lg border ${n.active ? 'bg-white border-slate-100' : 'bg-red-50/50 opacity-70 border-red-100'}`}><label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={n.active} onChange={() => toggleNursingActive(branch, idx)} className="w-4 h-4 cursor-pointer"/> 啟用</label><input type="text" value={n.name} onChange={e => updateNursingName(branch, idx, e.target.value)} className="input-sm flex-1"/><button onClick={() => deleteNursing(branch, idx)} className="text-red-500 px-2 py-1 bg-white border border-red-200 text-xs font-bold rounded">刪除</button></div>
                   ))}
                   <div className="flex gap-2 mt-4 pt-4 border-t border-dashed border-slate-200"><input type="text" placeholder="新護理師名稱..." value={newRosterNames[`nursing_${branch}`] || ''} onChange={e => handleNewNameChange(`nursing_${branch}`, e.target.value)} className="input-sm flex-1 bg-white" /><button onClick={() => { const val = newRosterNames[`nursing_${branch}`]; if(val && val.trim()) { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.nursing[branch].push({name: val.trim(), active: true}); return n; }); handleNewNameChange(`nursing_${branch}`, ''); } }} className="bg-sky-100 text-sky-700 px-5 rounded-lg font-bold text-sm">+ 新增</button></div>
                 </div>
                 );
               })}
               {rosterTab === 'counter' && COUNTER_BRANDS.map(brand => (
                  <div key={brand} className="space-y-4">
                     <h3 className="font-black text-2xl text-teal-800 mt-6 border-b-2 border-teal-200 pb-2">{brand}</h3>
                     {COUNTER_BRANCHES[brand].map(branch => {
                       if (!rosters.counter[brand][branch]) return null;
                       return (
                       <div key={branch} className="card-panel">
                         <h4 className="font-bold text-white bg-teal-600 p-2.5 rounded-lg mb-4 text-center">{branch}</h4>
                         <div className="mb-6 bg-orange-50/80 p-4 rounded-xl border border-orange-200"><span className="text-sm font-bold text-orange-800 block mb-3">主任 (整店獎金)</span><div className="flex items-center gap-3 bg-white p-2 rounded-lg border border-orange-200"><label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={rosters.counter[brand][branch].director.active} onChange={() => toggleCounterDirActive(brand, branch)} className="w-4 h-4"/> 啟用</label><input type="text" value={rosters.counter[brand][branch].director.name} onChange={e => updateCounterDirName(brand, branch, e.target.value)} className="input-sm flex-1 border-none" placeholder="無主任請留空"/></div></div>
                         <div className="mb-6"><span className="text-sm font-bold text-slate-600 block mb-3">評核人 (主管)</span>
                           {rosters.counter[brand][branch].evaluators.map((ev, idx) => (
                              <div key={idx} className={`flex items-center gap-2 mb-2 p-2 rounded-lg border ${ev.active ? 'bg-white border-slate-100' : 'bg-red-50/50 opacity-70 border-red-100'}`}><input type="checkbox" checked={ev.active} onChange={() => toggleCounterEvalActive(brand, branch, idx)} className="w-4 h-4 cursor-pointer"/><select value={ev.title} onChange={e => updateCounterEvalTitle(brand, branch, idx, e.target.value)} className="input-sm w-28">{['店經理', '店副理', '護理長', '行政主任', '客服主任', '主管'].map(t=><option key={t}>{t}</option>)}</select><input type="text" value={ev.name} onChange={e => updateCounterEvalName(brand, branch, idx, e.target.value)} className="input-sm flex-1"/><button onClick={() => deleteCounterEval(brand, branch, idx)} className="text-red-500 px-2 py-1 bg-white border border-red-200 text-xs font-bold rounded">刪除</button></div>
                           ))}
                           <div className="flex gap-2 mt-3 pt-3 border-t border-dashed border-slate-200"><input type="text" placeholder="新主管名稱..." value={newRosterNames[`eval_${brand}_${branch}`] || ''} onChange={e => handleNewNameChange(`eval_${brand}_${branch}`, e.target.value)} className="input-sm flex-1 bg-white" /><button onClick={() => { const val = newRosterNames[`eval_${brand}_${branch}`]; if (val && val.trim()) { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluators.push({title: '店經理', name: val.trim(), active: true}); return n; }); handleNewNameChange(`eval_${brand}_${branch}`, ''); } }} className="bg-teal-50 text-teal-800 px-4 py-1.5 rounded-lg font-bold text-sm">+ 新增評核人</button></div>
                         </div>
                         <div><span className="text-sm font-bold text-slate-600 block mb-3">受評者 (櫃台)</span>
                           {rosters.counter[brand][branch].evaluatees.map((emp, idx) => (
                              <div key={idx} className={`flex items-center gap-3 mb-2 p-2 rounded-lg border ${emp.active ? 'bg-white border-slate-100' : 'bg-red-50/50 opacity-70 border-red-100'}`}><input type="checkbox" checked={emp.active} onChange={() => toggleCounterEmpActive(brand, branch, idx)} className="w-4 h-4 cursor-pointer"/><input type="text" value={emp.name} onChange={e => updateCounterEmpName(brand, branch, idx, e.target.value)} className="input-sm flex-1"/><button onClick={() => deleteCounterEmp(brand, branch, idx)} className="text-red-500 px-2 py-1 bg-white border border-red-200 text-xs font-bold rounded">刪除</button></div>
                           ))}
                           <div className="flex gap-2 mt-3 pt-3 border-t border-dashed border-slate-200"><input type="text" placeholder="新受評者名稱..." value={newRosterNames[`emp_${brand}_${branch}`] || ''} onChange={e => handleNewNameChange(`emp_${brand}_${branch}`, e.target.value)} className="input-sm flex-1 bg-white" /><button onClick={() => { const val = newRosterNames[`emp_${brand}_${branch}`]; if (val && val.trim()) { setRosters(prev => { const n = JSON.parse(JSON.stringify(prev)); n.counter[brand][branch].evaluatees.push({name: val.trim(), active: true}); return n; }); handleNewNameChange(`emp_${brand}_${branch}`, ''); } }} className="bg-teal-50 text-teal-800 px-4 py-1.5 rounded-lg font-bold text-sm">+ 新增受評者</button></div>
                         </div>
                       </div>
                       );
                     })}
                  </div>
               ))}
             </div>
          </div>
        );
      };

      const renderSettings = () => (
        <div className="max-w-xl mx-auto bg-slate-100 min-h-screen p-6 pb-20">
           <div className="flex justify-between items-center mb-6"><button onClick={() => setCurrentView('home')} className="font-bold text-slate-500">返回首頁</button></div>
           <div className="mb-6"><button onClick={() => setCurrentView('roster_manager')} className="btn-primary bg-sky-700">人員名單動態管理</button></div>
           <div className="card-panel !p-0 overflow-hidden">
              <div className="bg-slate-800 p-6 text-white text-center"><h2 className="text-2xl font-bold tracking-widest">系統權限與密碼設定</h2></div>
              <div className="p-6 space-y-5">
                <div><label className="text-sm font-bold text-slate-600 block mb-2">總管理密碼</label><input type="text" value={editingPasswords.superadmin} onChange={(e) => setEditingPasswords({...editingPasswords, superadmin: e.target.value})} className="input-sm bg-white" /></div>
                <div><label className="text-sm font-bold text-slate-600 block mb-2">人資密碼</label><input type="text" value={editingPasswords.hr} onChange={(e) => setEditingPasswords({...editingPasswords, hr: e.target.value})} className="input-sm bg-white" /></div>
                <hr className="border-slate-200"/>
                <div><label className="text-sm font-bold text-slate-600 block mb-2">主管密碼 (服務品質評核用)</label><input type="text" value={editingPasswords.manager} onChange={(e) => setEditingPasswords({...editingPasswords, manager: e.target.value})} className="input-sm bg-white" /></div>
                <div><label className="text-sm font-bold text-slate-600 block mb-2">店經理密碼 (服務品質核決用)</label><input type="text" value={editingPasswords.storeManager} onChange={(e) => setEditingPasswords({...editingPasswords, storeManager: e.target.value})} className="input-sm bg-white" /></div>
                <hr className="border-slate-200"/>
                <div><label className="text-sm font-bold text-slate-600 block mb-2">護理長密碼 (醫療安全解鎖用)</label><input type="text" value={editingPasswords.safetyUnlock} onChange={(e) => setEditingPasswords({...editingPasswords, safetyUnlock: e.target.value})} className="input-sm bg-white" /></div>
              </div>
              <div className="p-4 bg-slate-100 border-t border-slate-200"><button onClick={handleSavePasswords} className="btn-primary bg-slate-800 hover:bg-slate-900">儲存並更新密碼設定</button></div>
           </div>
        </div>
      );

      return (
        <React.Fragment>
          {(sysModule === 'portal' || currentView === 'home') && (
            <div className="fixed top-4 right-4 z-50 no-print animate-fade-in"><button onClick={handleAdminToggle} className={`px-4 py-2 rounded-full text-xs font-bold shadow-md border ${isSuperAdmin ? 'bg-red-600/90 text-white border-red-700' : isHrLoggedIn ? 'bg-purple-600/90 text-white border-purple-700' : 'bg-white/80 text-slate-600 border-slate-300'}`}>{isSuperAdmin ? '總管已登入' : isHrLoggedIn ? '人資已登入' : '管理登入'}</button></div>
          )}
          {currentView === 'settings' && isSuperAdmin ? renderSettings() :
           currentView === 'roster_manager' && isSuperAdmin ? renderRosterManager() :
           sysModule === 'portal' ? renderPortal() : (
            <React.Fragment>
              {currentView === 'home' && renderHome()}
              {currentView === 'service' && renderServiceQuality()}
              {currentView === 'safety' && renderMedicalSafety()}
              {currentView === 'counter_form' && renderCounterForm()}
              {currentView === 'dashboard' && renderDashboard()}
              {currentView === 'report' && renderReport()}
            </React.Fragment>
          )}

          {showPasswordModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-fade-in">
                <h3 className="text-xl font-bold text-slate-800 mb-2">需要授權</h3><p className="text-slate-500 text-sm mb-4">請輸入密碼以解鎖此功能。</p>
                <input type="password" placeholder="請輸入密碼" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && confirmPassword()} className="input-sm bg-white mb-5" />
                <div className="flex gap-3"><button onClick={() => {setShowPasswordModal(false); setPasswordInput('');}} className="btn-secondary">取消</button><button onClick={confirmPassword} className="flex-1 py-3 rounded-xl font-bold bg-sky-600 text-white hover:bg-sky-700 shadow-sm">確認</button></div>
              </div>
            </div>
          )}

          {sysModal.show && (
            <div className="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-fade-in text-center flex flex-col max-h-[90vh]">
                <h3 className="text-lg font-bold text-slate-800 mb-2 shrink-0">{sysModal.type === 'alert' ? '系統提示' : '請確認'}</h3>
                <div className={`text-slate-600 text-sm mb-6 whitespace-pre-line bg-slate-50 p-4 rounded-xl border border-slate-100 overflow-y-auto ${sysModal.alignLeft ? 'text-left' : 'text-center'}`}>{sysModal.msg}</div>
                <div className="flex gap-3 justify-center shrink-0">
                  {sysModal.type === 'confirm' && <button onClick={() => setSysModal({show: false})} className="btn-secondary">取消</button>}
                  <button onClick={() => { if (sysModal.onConfirm) sysModal.onConfirm(); setSysModal({show: false}); }} className={`flex-1 py-3 rounded-xl font-bold text-white shadow-sm ${sysModal.type === 'confirm' ? 'bg-red-500 hover:bg-red-600' : 'bg-sky-600 hover:bg-sky-700'}`}>確定</button>
                </div>
              </div>
            </div>
          )}

          {showSopModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-[70] flex items-center justify-center p-4 backdrop-blur-sm no-print">
              <div className="bg-slate-50 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-fade-in border border-slate-200">
                <div className="bg-teal-700 p-4 text-white flex justify-between items-center sticky top-0"><h3 className="font-bold text-lg tracking-wider">醫療安全 SOP</h3><button onClick={() => setShowSopModal(false)} className="text-teal-100 hover:text-white bg-teal-800/50 rounded-full p-1 transition-colors"><svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg></button></div>
                <div className="p-6 overflow-y-auto space-y-5 bg-slate-100">
                   {MEDICAL_SOP.map((sop, idx) => (<div key={idx} className="bg-white p-5 rounded-xl shadow-sm border border-slate-200"><h4 className="font-bold text-teal-800 mb-2 border-b border-slate-100 pb-2">{sop.title}</h4><p className="text-sm text-slate-600 whitespace-pre-line leading-relaxed">{sop.content}</p></div>))}
                </div>
                <div className="p-4 border-t border-slate-200 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10"><button onClick={() => setShowSopModal(false)} className="w-full py-3 rounded-xl font-bold bg-teal-600 text-white hover:bg-teal-700 shadow-sm">了解並關閉</button></div>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    const root = window.ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
